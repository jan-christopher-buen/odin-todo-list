<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Organize your todos into projects, set priorities, and keep your plans saved in your browser." />
    <link rel="stylesheet" href="<%= require('./styles.css') %>" />
    <title>Odin Todo List</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to todos</a>
    <header class="site-header">
      <p class="eyebrow">A little focus, every day</p>
      <h1>Odin Todo List<span aria-hidden="true">.</span></h1>
      <p class="subtitle">Make room for what matters.</p>
    </header>
    <p id="storage-status" role="alert" hidden></p>
    <div class="app-layout">
    <nav aria-labelledby="projects-heading">
      <h2 id="projects-heading">Projects</h2>
      <ul id="project-list"></ul>
      <form id="project-form">
        <label for="project-name">New project name</label>
        <input id="project-name" name="projectName" required aria-describedby="project-error" />
        <button type="submit">Add project</button>
        <p id="project-error" role="alert"></p>
      </form>
    </nav>
    <main id="main-content" tabindex="-1">
      <div class="project-toolbar">
        <div>
          <p class="eyebrow">Your focus</p>
          <h2 id="project-heading" tabindex="-1">Inbox</h2>
        </div>
        <button id="add-todo" class="primary-button" type="button">+ Add todo</button>
      </div>
      <p id="action-status" class="visually-hidden" role="status"></p>
      <p id="empty-state">No todos in this project. Add a todo to get started.</p>
      <ul id="todo-list" aria-labelledby="project-heading"></ul>
    </main>
    </div>
    <footer>Built for The Odin Project. Your plans stay in this browser.</footer>
    <dialog id="todo-dialog" aria-labelledby="todo-dialog-heading">
      <h2 id="todo-dialog-heading">Add todo</h2>
      <p id="todo-project-name"></p>
      <form id="todo-form">
        <p>
          <label for="todo-title">Title (required)</label>
          <input id="todo-title" name="title" required autofocus aria-describedby="todo-error" />
        </p>
        <p>
          <label for="todo-description">Description</label>
          <textarea id="todo-description" name="description" rows="4"></textarea>
        </p>
        <p>
          <label for="todo-due-date">Due date</label>
          <input id="todo-due-date" name="dueDate" type="date" />
        </p>
        <p>
          <label for="todo-priority">Priority</label>
          <select id="todo-priority" name="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </p>
        <p id="todo-error" role="alert"></p>
        <div class="dialog-actions">
          <button type="submit" class="primary-button">Save todo</button>
          <button id="cancel-todo" type="button">Cancel</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
